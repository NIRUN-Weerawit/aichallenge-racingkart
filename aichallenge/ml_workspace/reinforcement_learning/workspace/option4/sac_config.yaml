# Option 4 — SAC 20-step velocity profile for MPC
algorithm:
  name: sac
  policy: MlpPolicy
  verbose: 1
  learning_rate: 3e-4
  buffer_size: 50000
  batch_size: 256
  learning_starts: 1000
  gamma: 0.99
  tau: 0.005
  ent_coef: auto_0.1
  train_freq: [1, step]
  gradient_steps: 1
  policy_kwargs:
    net_arch: [512, 512]
    log_std_init: 0.0   # exp(0) = 1.0 — proper SAC exploration

  total_timesteps: 1000000

reward:
  name: velocity_profile_reward
  smoothness_weight: 0.01
  speed_weight: 0.1
  collision_penalty: 100.0

termination:
  name: default_collision_termination
  collision_speed_threshold: 10.0
  collision_count_threshold: 3
  collision_speed_drop_threshold: 1.5
  min_speed_before_drop: 2.0

timelimit:
  enable: true
  max_episode_steps: 5000

velocity_profile_env:
  horizon: 20
  v_max: 20.0
  v_min: 1.0
  smoothness_weight: 0.01
  speed_weight: 0.1
